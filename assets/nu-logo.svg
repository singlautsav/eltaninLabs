<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <linearGradient id="nuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- NU Shield / Crest Monogram -->
  <rect x="4" y="5" width="40" height="40" rx="8" fill="rgba(251, 191, 36, 0.12)" stroke="url(#nuGoldGrad)" stroke-width="1.8"/>
  <text x="24" y="32" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#fbbf24" letter-spacing="1">NU</text>
  
  <!-- National University Wordmark -->
  <text x="56" y="24" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#ffffff">NATIONAL</text>
  <text x="56" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#94a3b8">UNIVERSITY</text>
</svg>
